<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LinkedIn badge test</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #F7F5F0; color: #18181B; margin: 0; padding: 32px; }
  h1 { font-family: Georgia, serif; margin: 0 0 4px; }
  p { color: #71717A; margin: 0 0 24px; }
  .row { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
  .cell { background: #fff; border: 1px solid #E4E2DC; border-radius: 20px; padding: 16px; }
  .cell h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: #71717A; margin: 0 0 12px; }
</style>
</head>
<body>
  <h1>LinkedIn profile badge test</h1>
  <p>LinkedIn's official embed, loaded from a public profile URL only.</p>
  <div class="row">
    <div class="cell">
      <h2>Vertical, light</h2>
      <div class="badge-base LI-profile-badge" data-locale="en_US" data-size="medium" data-theme="light" data-type="VERTICAL" data-vanity="satyanadella" data-version="v1"></div>
    </div>
    <div class="cell">
      <h2>Horizontal, light</h2>
      <div class="badge-base LI-profile-badge" data-locale="en_US" data-size="medium" data-theme="light" data-type="HORIZONTAL" data-vanity="williamhgates" data-version="v1"></div>
    </div>
    <div class="cell">
      <h2>Vertical, dark</h2>
      <div class="badge-base LI-profile-badge" data-locale="en_US" data-size="large" data-theme="dark" data-type="VERTICAL" data-vanity="jeffweiner08" data-version="v1"></div>
    </div>
  </div>
  <script src="https://platform.linkedin.com/badges/js/profile.js" async defer type="text/javascript"></script>
</body>
</html>
